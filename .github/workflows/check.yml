name: Code Quality

on:
  push:
    branches:
      - kitsune
      - dev
  pull_request:
    branches:
      - kitsune
      - dev
  workflow_dispatch:

jobs:
  rust-check:
    name: Rust Checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up NDK
        run: python build.py -v ndk

      - name: Rust checks
        run: |
          cd native/src
          ../ndk/build/ndk-build --version || true
          export PATH="$ANDROID_SDK_ROOT/ndk/magisk/toolchains/rust/bin:$PATH"
          cargo check --workspace --all-targets
        shell: bash

  kotlin-lint:
    name: Kotlin Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Run lint
        run: ./gradlew lint app:lint stub:lint

      - name: Upload lint reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-reports-${{ github.sha }}
          path: |
            **/build/reports/lint-results*.html
            **/build/reports/lint-results*.xml
          compression-level: 9
