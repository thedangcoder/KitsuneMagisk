name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag version (e.g., v30.7)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    env:
      SCCACHE_DIRECT: false
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Build release
        run: ./build.py -vr all

      - name: Build debug
        run: ./build.py -v all

      - name: Stop gradle daemon
        run: ./gradlew --stop

      - name: Prepare release assets
        run: |
          mkdir -p release
          cp out/app-release.apk release/Magisk-${{ github.ref_name }}.apk 2>/dev/null || true
          cp out/app-debug.apk release/app-debug.apk 2>/dev/null || true
          cp out/magisk-* release/ 2>/dev/null || true
          ls -la release/

      - name: Generate release notes
        id: release_notes
        run: |
          if [ -f docs/changelog.md ]; then
            echo "notes_file=docs/changelog.md" >> $GITHUB_OUTPUT
          else
            echo "notes_file=" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Magisk ${{ github.ref_name }}
          body_path: ${{ steps.release_notes.outputs.notes_file }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
          files: |
            release/*.apk
            release/magisk-*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
